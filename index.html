<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1b1d21;
    --muted: #6a707c;
    --border: #dfe2e7;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --ok: #1d8a4e;
    --ok-bg: #e6f5ec;
    --bad: #c23a2b;
    --bad-bg: #fbeae8;
    --warn: #9a6400;
    --warn-bg: #fff4dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b;
      --panel: #1e2126;
      --text: #e8eaee;
      --muted: #9aa1ad;
      --border: #333841;
      --accent: #5b8ff9;
      --accent-text: #0d1117;
      --ok: #5fd08f;
      --ok-bg: #173324;
      --bad: #f08577;
      --bad-bg: #3a1e1a;
      --warn: #f1c065;
      --warn-bg: #3a2f14;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 16px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .preview { order: -1; }
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  fieldset {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 20px 0 0;
    padding: 16px 0 0;
  }
  legend {
    font-weight: 600;
    padding: 0 8px 0 0;
  }
  .field { margin-top: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  textarea, select {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  textarea { resize: vertical; min-height: 64px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .range-label { display: flex; justify-content: space-between; }
  .range-label output { color: var(--text); font-variant-numeric: tabular-nums; }

  .drop {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 72px;
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .drop img {
    width: 48px; height: 48px; object-fit: contain;
    border-radius: 6px; background: #fff; border: 1px solid var(--border);
    display: none;
  }
  .drop.has-logo img { display: block; }
  .drop .drop-text { flex: 1; color: var(--muted); }
  .drop #removeLogo { display: none; }
  .drop.has-logo #removeLogo { display: inline-block; }

  button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }

  .preview { position: sticky; top: 24px; }
  .qr-frame {
    background: #fff;
    border-radius: 10px;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .qr-frame svg, .qr-frame canvas { width: 100%; height: 100%; display: block; }
  .qr-frame .empty { color: #8a8f99; padding: 24px; text-align: center; }
  .status {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    color: var(--muted);
    min-height: 42px;
  }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.bad { background: var(--bad-bg); color: var(--bad); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status .note { display: block; margin-top: 4px; font-size: 13px; }
  .buttons { display: flex; gap: 10px; margin-top: 14px; }
  .buttons button { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<main class="app">
  <section class="panel controls">
    <h1>QR Code Generator</h1>

    <div class="field">
      <label for="data">URL or text</label>
      <textarea id="data" rows="3" placeholder="https://example.com" spellcheck="false"></textarea>
    </div>

    <fieldset>
      <legend>Center image</legend>
      <div id="drop" class="drop">
        <input type="file" id="logoFile" accept="image/*" hidden>
        <img id="logoThumb" alt="Logo preview">
        <span class="drop-text">Drop an image here or <button type="button" class="link" id="pickLogo">browse</button></span>
        <button type="button" id="removeLogo">Remove</button>
      </div>

      <div class="row">
        <div class="field">
          <div class="range-label"><label for="logoSize">Logo size</label><output id="logoSizeOut"></output></div>
          <input type="range" id="logoSize" min="10" max="70" step="1">
        </div>
        <div class="field">
          <div class="range-label"><label for="logoPadding">Logo padding</label><output id="logoPaddingOut"></output></div>
          <input type="range" id="logoPadding" min="0" max="30" step="1">
        </div>
      </div>

      <div class="field">
        <label for="backdrop">Behind the logo</label>
        <select id="backdrop">
          <option value="clear">Clear the dots (square area)</option>
          <option value="rounded">White rounded badge</option>
          <option value="circle">White circle badge</option>
          <option value="square">White square badge</option>
          <option value="none">Nothing (logo sits on the dots)</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Shapes</legend>
      <div class="row">
        <div class="field">
          <label for="dotType">Dots</label>
          <select id="dotType">
            <option value="square">Square</option>
            <option value="dots">Dots</option>
            <option value="rounded">Rounded</option>
            <option value="extra-rounded">Extra rounded</option>
            <option value="classy">Classy</option>
            <option value="classy-rounded">Classy rounded</option>
          </select>
        </div>
        <div class="field">
          <label for="cornerSquareType">Corner frames</label>
          <select id="cornerSquareType">
            <option value="square">Square</option>
            <option value="extra-rounded">Rounded</option>
            <option value="dot">Circle</option>
          </select>
        </div>
        <div class="field">
          <label for="cornerDotType">Corner centers</label>
          <select id="cornerDotType">
            <option value="square">Square</option>
            <option value="dot">Circle</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Border &amp; export</legend>
      <div class="row">
        <div class="field">
          <div class="range-label"><label for="margin">Quiet zone (border)</label><output id="marginOut"></output></div>
          <input type="range" id="margin" min="0" max="15" step="1">
        </div>
        <div class="field">
          <label for="exportSize">PNG size</label>
          <select id="exportSize">
            <option value="512">512 × 512</option>
            <option value="1024">1024 × 1024</option>
            <option value="2048">2048 × 2048</option>
            <option value="4096">4096 × 4096</option>
          </select>
        </div>
      </div>
      <p class="hint">Codes use error correction level H (~30% recoverable), which is what lets the logo cover part of the code. Settings are remembered in this browser.</p>
    </fieldset>
  </section>

  <section class="panel preview">
    <div id="qr" class="qr-frame"></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="buttons">
      <button type="button" class="primary" id="dlPng">Download PNG</button>
      <button type="button" id="dlSvg">Download SVG</button>
    </div>
  </section>
</main>

<script>
(() => {
  const STORAGE_KEY = 'qr-generator:v1';
  const PREVIEW_SIZE = 900;     // canvas px; downscaled by CSS so it stays sharp on retina
  const VERIFY_SIZE = 600;
  const MAX_STORED_LOGO = 512;   // px, keeps localStorage usage small
  const MAX_COMPOSED_LOGO = 1024;

  const defaults = {
    data: 'https://example.com',
    logo: null,            // data URL of the uploaded image (downscaled)
    logoSize: 40,          // maps to imageOptions.imageSize (0.1–0.7)
    logoPadding: 8,        // % of the logo's largest side
    backdrop: 'clear',
    dotType: 'rounded',
    cornerSquareType: 'extra-rounded',
    cornerDotType: 'dot',
    margin: 6,             // % of the total image size
    exportSize: '1024',
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    data: $('data'), logoFile: $('logoFile'), logoThumb: $('logoThumb'), drop: $('drop'),
    pickLogo: $('pickLogo'), removeLogo: $('removeLogo'),
    logoSize: $('logoSize'), logoSizeOut: $('logoSizeOut'),
    logoPadding: $('logoPadding'), logoPaddingOut: $('logoPaddingOut'),
    backdrop: $('backdrop'), dotType: $('dotType'),
    cornerSquareType: $('cornerSquareType'), cornerDotType: $('cornerDotType'),
    margin: $('margin'), marginOut: $('marginOut'), exportSize: $('exportSize'),
    qr: $('qr'), status: $('status'), dlPng: $('dlPng'), dlSvg: $('dlSvg'),
  };

  // ---------- state & persistence ----------

  const state = { ...defaults, ...load() };
  let composedLogo = null;   // logo with padding/backdrop baked in
  let generation = 0;        // guards against out-of-order async renders

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch {
      // Quota exceeded (large logo) — keep the other settings at least.
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, logo: null })); } catch {}
    }
  }

  // ---------- image helpers ----------

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('Could not load image'));
      img.src = src;
    });
  }

  async function fileToDataUrl(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      const w = img.naturalWidth || MAX_STORED_LOGO;
      const h = img.naturalHeight || MAX_STORED_LOGO;
      const scale = Math.min(1, MAX_STORED_LOGO / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.round(w * scale);
      c.height = Math.round(h * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/png');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function roundedRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Bakes padding and an optional white badge into a square PNG, so the
  // library only has to place a single image.
  async function composeLogo(src, paddingPct, backdrop) {
    const img = await loadImage(src);
    const w = img.naturalWidth, h = img.naturalHeight;
    const inner = backdrop === 'circle' ? Math.hypot(w, h) : Math.max(w, h);
    const S = inner + 2 * inner * (paddingPct / 100);
    const scale = Math.min(1, MAX_COMPOSED_LOGO / S);

    const c = document.createElement('canvas');
    c.width = c.height = Math.round(S * scale);
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff';

    if (backdrop === 'square') {
      ctx.fillRect(0, 0, S, S);
    } else if (backdrop === 'rounded') {
      roundedRectPath(ctx, 0, 0, S, S, S * 0.2);
      ctx.fill();
    } else if (backdrop === 'circle') {
      ctx.beginPath();
      ctx.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
    return c.toDataURL('image/png');
  }

  // ---------- QR options ----------

  // qr-code-styling writes each char code as a single byte (Latin-1), which
  // mangles anything non-ASCII. Pre-encode to UTF-8 so each char is one byte;
  // scanners decode byte mode as UTF-8.
  function toUtf8ByteString(text) {
    return String.fromCharCode(...new TextEncoder().encode(text));
  }

  function buildOptions(size, type) {
    const opts = {
      type,
      width: size,
      height: size,
      margin: Math.round(size * state.margin / 100),
      data: toUtf8ByteString(state.data),
      qrOptions: { errorCorrectionLevel: 'H' },
      dotsOptions: { type: state.dotType, color: '#000000' },
      cornersSquareOptions: { type: state.cornerSquareType, color: '#000000' },
      cornersDotOptions: { type: state.cornerDotType, color: '#000000' },
      backgroundOptions: { color: '#ffffff' },
      imageOptions: {
        hideBackgroundDots: state.backdrop === 'clear',
        imageSize: state.logoSize / 100,
        margin: 0,
        saveAsBlob: false,
      },
    };
    if (composedLogo) opts.image = composedLogo;
    return opts;
  }

  // ---------- rendering ----------

  const preview = new QRCodeStyling({ ...buildOptions(PREVIEW_SIZE, 'canvas'), data: 'x' });
  let previewAttached = false;

  function setStatus(kind, text, note) {
    els.status.className = 'status' + (kind ? ' ' + kind : '');
    els.status.textContent = text;
    if (note) {
      const span = document.createElement('span');
      span.className = 'note';
      span.textContent = note;
      els.status.appendChild(span);
    }
  }

  function setDownloadsEnabled(on) {
    els.dlPng.disabled = !on;
    els.dlSvg.disabled = !on;
  }

  async function render() {
    const gen = ++generation;

    if (!state.data.trim()) {
      els.qr.innerHTML = '<div class="empty">Enter a URL or some text to generate a code.</div>';
      previewAttached = false;
      setStatus('', 'Waiting for content…');
      setDownloadsEnabled(false);
      return;
    }

    try {
      composedLogo = state.logo
        ? await composeLogo(state.logo, state.logoPadding, state.backdrop)
        : null;
    } catch {
      composedLogo = null;
    }
    if (gen !== generation) return;

    // Build a throwaway instance first so an over-long input surfaces as an
    // error here rather than leaving the preview half-updated.
    const opts = buildOptions(PREVIEW_SIZE, 'canvas');
    try {
      await new QRCodeStyling(opts).getRawData('svg');
    } catch (err) {
      if (gen !== generation) return;
      const msg = String(err && err.message || err);
      setStatus('bad', 'This can’t be turned into a QR code.',
        /overflow/i.test(msg) ? 'The text is too long. At error correction level H, a QR code holds about 1,200 characters.' : msg);
      setDownloadsEnabled(false);
      return;
    }
    if (gen !== generation) return;

    if (!previewAttached) {
      els.qr.innerHTML = '';
      preview.append(els.qr);
      previewAttached = true;
    }
    preview.update(opts);
    setDownloadsEnabled(true);
    setStatus('', 'Checking that the code scans…');

    const result = await verify();
    if (gen !== generation) return;

    const borderNote = state.margin < 4
      ? 'The border is thin. Some scanners need blank space around the code, so consider a quiet zone of at least 4%.'
      : null;

    if (result === 'ok') {
      setStatus(borderNote ? 'warn' : 'ok', '✓ Scans correctly' + (composedLogo ? ' with the logo in place.' : '.'), borderNote);
    } else if (result === 'mismatch') {
      setStatus('bad', '✗ The code scans but decodes to different text.',
        'This can happen with some special characters. Test it with your phone before using it.');
    } else {
      setStatus('bad', '✗ This code may not scan reliably.',
        composedLogo
          ? 'The logo is covering too much of the code. Reduce the logo size or padding, or try “Clear the dots” under Behind the logo.'
          : 'Try a simpler dot shape or a larger quiet zone.');
    }
  }

  // Renders an off-screen PNG and decodes it with jsQR to confirm the logo
  // hasn't destroyed too much of the code.
  async function verify() {
    try {
      const v = new QRCodeStyling(buildOptions(VERIFY_SIZE, 'canvas'));
      const blob = await v.getRawData('png');
      const bmp = await createImageBitmap(blob);
      // Pad with white so the check tests the logo, not the quiet zone
      // (the border gets its own warning).
      const pad = 40;
      const c = document.createElement('canvas');
      c.width = bmp.width + pad * 2;
      c.height = bmp.height + pad * 2;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bmp, pad, pad);
      const img = ctx.getImageData(0, 0, c.width, c.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (!code) return 'fail';
      return code.data === state.data ? 'ok' : 'mismatch';
    } catch {
      return 'fail';
    }
  }

  let renderTimer;
  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 150);
  }

  // ---------- downloads ----------

  async function download(ext) {
    const size = ext === 'png' ? Number(state.exportSize) : 1024;
    const q = new QRCodeStyling(buildOptions(size, ext === 'svg' ? 'svg' : 'canvas'));
    const name = 'qr-' + (state.data.replace(/^https?:\/\//, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').slice(0, 40) || 'code');
    await q.download({ name, extension: ext });
  }

  els.dlPng.addEventListener('click', () => download('png'));
  els.dlSvg.addEventListener('click', () => download('svg'));

  // ---------- logo input ----------

  async function setLogoFromFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    try {
      state.logo = await fileToDataUrl(file);
    } catch {
      setStatus('bad', 'That image couldn’t be read. Try a PNG, JPG, or SVG.');
      return;
    }
    syncLogoUi();
    save();
    scheduleRender();
  }

  function syncLogoUi() {
    els.drop.classList.toggle('has-logo', !!state.logo);
    if (state.logo) els.logoThumb.src = state.logo;
    else els.logoThumb.removeAttribute('src');
  }

  els.pickLogo.addEventListener('click', () => els.logoFile.click());
  els.logoFile.addEventListener('change', () => {
    setLogoFromFile(els.logoFile.files[0]);
    els.logoFile.value = '';
  });
  els.removeLogo.addEventListener('click', () => {
    state.logo = null;
    syncLogoUi();
    save();
    scheduleRender();
  });

  els.drop.addEventListener('dragover', (e) => { e.preventDefault(); els.drop.classList.add('over'); });
  els.drop.addEventListener('dragleave', () => els.drop.classList.remove('over'));
  els.drop.addEventListener('drop', (e) => {
    e.preventDefault();
    els.drop.classList.remove('over');
    setLogoFromFile(e.dataTransfer.files[0]);
  });

  // Pasting an image anywhere on the page sets it as the logo.
  document.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); setLogoFromFile(item.getAsFile()); }
  });

  // ---------- settings controls ----------

  const outputs = {
    logoSize: (v) => v + '%',
    logoPadding: (v) => v + '%',
    margin: (v) => v + '%',
  };

  function bindControl(key) {
    const el = els[key];
    el.value = state[key];
    const out = els[key + 'Out'];
    const sync = () => { if (out) out.textContent = outputs[key](el.value); };
    sync();
    el.addEventListener('input', () => {
      state[key] = el.type === 'range' ? Number(el.value) : el.value;
      sync();
      save();
      scheduleRender();
    });
  }

  ['data', 'logoSize', 'logoPadding', 'backdrop', 'dotType', 'cornerSquareType',
   'cornerDotType', 'margin', 'exportSize'].forEach(bindControl);

  syncLogoUi();
  render();
})();
</script>
</body>
</html>
